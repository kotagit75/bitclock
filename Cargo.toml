[package]
name = "bitclock"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
chrono = "0.4.44"
clap = { version = "4.6.0", features = ["derive"] }
hex = "0.4.3"
log = "0.4.29"
openssl = "0.10.76"
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"]}
serde_json = "1.0.149"
sha2 = "0.10.9"
simple_logger = "5.2.0"
sysinfo = "0.38.4"
tokio = { version = "1.50.0", features = ["full"]}
vdf = "0.1.0"
